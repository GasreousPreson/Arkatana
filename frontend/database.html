<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Numera 对局库</title>

<link rel="stylesheet" href="/game.css?v=10">
<link rel="stylesheet" href="/review.css?v=10">

</head>

<body>

<div id="shell">

<nav id="sidebar">

    <a class="nav-item" href="/">play</a>
    <a class="nav-item" href="/">studys</a>
    <a class="nav-item" href="/">openings</a>
    <a class="nav-item" href="/database">database</a>
    <a class="nav-item" href="/import">import game</a>
    <a class="nav-item" href="/">community</a>
    <a class="nav-item" href="/">friends</a>

    <div id="sidebar-foot">
        <a id="account" href="/">
            <span id="avatar">?</span>
            <span id="account-name">Anonymous</span>
        </a>
    </div>

</nav>

<div id="page">

    <h1>Database</h1>

    <div id="filters">

        <label class="filter">
            <span>棋手</span>
            <input id="f-player" type="text" placeholder="用户名">
        </label>

        <label class="filter">
            <span>对手</span>
            <input id="f-opponent" type="text" placeholder="用户名">
        </label>

        <label class="filter">
            <span>模式</span>
            <select id="f-mode">
                <option value="">全部</option>
                <option value="casual">casual</option>
                <option value="rated">rated</option>
            </select>
        </label>

        <label class="filter">
            <span>起始日期</span>
            <input id="f-from" type="date">
        </label>

        <label class="filter">
            <span>结束日期</span>
            <input id="f-to" type="date">
        </label>

        <button class="btn" id="f-search">搜索</button>

        <button class="btn" id="f-reset">重置</button>

    </div>

    <table class="games">

        <thead>
            <tr>
                <th>日期</th>
                <th>红方</th>
                <th>黑方</th>
                <th>时间</th>
                <th>模式</th>
                <th>手数</th>
                <th>结果</th>
            </tr>
        </thead>

        <tbody id="rows"></tbody>

    </table>

    <div id="empty" class="empty"></div>

    <div class="pager">
        <button class="btn" id="prev-page">上一页</button>
        <span id="page-info"></span>
        <button class="btn" id="next-page">下一页</button>
    </div>

</div>

</div>

<div id="toast"></div>

<script src="/app.js?v=10"></script>
<script src="/database.js?v=10"></script>

</body>
</html>
