<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>古戰棋 Arkatana</title>
<style>
  :root {
    --ink: #17161a;
    --ink-raised: #232228;
    --parchment-light: #e6e4de;   /* 浅格：几乎中性的浅灰 */
    --parchment-dark: #c2bdb2;    /* 深格：几乎中性的灰 */
    --cinnabar: #a6362b;
    --jade: #3f6656;
    --gold: #b8944b;
    --gold-soft: rgba(184, 148, 75, 0.16);
    --danger: #c0392b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--parchment-light);
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
  }

  a { color: var(--gold); }

  /* ------------------------------------------------------------ */
  /* 顶部条                                                          */
  /* ------------------------------------------------------------ */
  header.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    border-bottom: 1px solid rgba(184, 148, 75, 0.25);
  }
  header.top-bar .brand {
    font-family: "SimSun", "Songti SC", Georgia, serif;
    font-weight: 700;
    letter-spacing: 0.12em;
    font-size: 18px;
    text-decoration: none;
    color: var(--parchment-light);
  }
  #btn-quit-single {
    margin-left: 18px;
    padding: 5px 12px;
    font-size: 12px;
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 3px;
    cursor: pointer;
  }
  #btn-quit-single:hover { background: rgba(192, 57, 43, 0.15); }
  header.top-bar .right-info {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    color: var(--gold);
  }
  #game-id-chip { opacity: 0.75; }

  /* ------------------------------------------------------------ */
  /* 三栏布局                                                        */
  /* ------------------------------------------------------------ */
  /* ---------------------------------------------------------------- */
  /* 整体布局：CSS Grid 命名区域——同一份 DOM，桌面/手机各自定义区域摆放，
     不需要维护两套元素。移动端断点见文件末尾的 @media 块。            */
  /* ---------------------------------------------------------------- */
  .table-layout {
    display: grid;
    gap: 14px;
    padding: 20px 16px 60px;
    max-width: 1180px;
    margin: 0 auto;
    grid-template-columns: 250px 1fr 250px;
    grid-template-areas:
      "top-card    board  info-chat"
      "move-nav    board  info-chat"
      "banners     board  info-chat"
      "actions     board  info-chat"
      "bottom-card board  info-chat";
    align-items: start;
  }

  /* min-width:0 是关键：Grid/Flex 子项默认的最小宽度是"内容本身的完整宽度"，
     如果不显式清零，棋谱这种横向不换行的内容会把整条网格列撑宽，
     导致棋谱、按钮、聊天室看起来比棋盘还宽、还会顶到屏幕外面去。 */
  .area-top-card    { grid-area: top-card;    min-width: 0; }
  .area-board        { grid-area: board;       min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .area-bottom-card { grid-area: bottom-card; min-width: 0; }
  .area-move-nav    { grid-area: move-nav;    min-width: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .area-banners      { grid-area: banners;     min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .area-actions       { grid-area: actions;     min-width: 0; }
  .area-info-chat   { grid-area: info-chat;   min-width: 0; display: flex; flex-direction: column; gap: 10px; }

  .area-move-nav .move-list-card { flex: 1; max-height: 260px; }

  /* 汉堡菜单按钮：默认隐藏，只在手机断点显示 */
  .m-menu-btn { display: none; }

  #m-drawer-backdrop { display: none; }
  #m-drawer {
    display: none;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 220px;
    background: var(--ink-raised);
    border-right: 1px solid var(--gold);
    z-index: 40;
    padding: 60px 0 20px;
    transform: translateX(-100%);
    transition: transform 0.2s ease;
  }
  #m-drawer.open { transform: translateX(0); }
  #m-drawer ul { list-style: none; margin: 0; padding: 0; }
  #m-drawer li a {
    display: block;
    padding: 12px 20px;
    color: var(--parchment-light);
    text-decoration: none;
    font-size: 14px;
  }
  #m-drawer li a:hover { background: rgba(184,148,75,0.12); }

  .card {
    border: 1px solid var(--gold);
    background: var(--gold-soft);
    border-radius: 4px;
    padding: 12px 14px;
    width: 100%;
    box-sizing: border-box;
  }
  .card h2 {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 8px;
  }

  /* ------------------------------------------------------------ */
  /* 棋手信息卡 + 棋钟                                                */
  /* ------------------------------------------------------------ */
  .player-card {
    border: 1px solid var(--gold);
    background: var(--ink-raised);
    border-radius: 4px;
    padding: 10px 12px;
  }
  .player-card .name-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    margin-bottom: 8px;
  }
  .player-card .name-row .name { font-weight: 700; }
  .player-card .name-row .rating {
    color: var(--gold);
    font-size: 13px;
  }
  .player-card .name-row .rating .delta { font-size: 11px; margin-left: 3px; }
  .player-card .name-row .rating .delta.up { color: #6fae6f; }
  .player-card .name-row .rating .delta.down { color: var(--cinnabar); }

  .clock-box {
    background: #8a6a1e;
    color: #fff;
    border-radius: 3px;
    padding: 6px 10px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: Consolas, "Courier New", monospace;
    opacity: 0.55;
  }
  .clock-box.active {
    background: var(--gold);
    opacity: 1;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset;
  }
  .clock-box .time { font-size: 22px; font-weight: 700; }
  .clock-box .increment { font-size: 12px; opacity: 0.85; }
  .clock-box.low { background: var(--danger); }

  /* ------------------------------------------------------------ */
  /* 走子记录                                                        */
  /* ------------------------------------------------------------ */
  .move-list-card {
    border: 1px solid var(--gold);
    background: rgba(184, 148, 75, 0.05);
    border-radius: 4px;
    flex: 1;
    min-height: 120px;
    max-height: 260px;
    overflow-y: auto;
    padding: 8px 10px;
    width: 100%;
    box-sizing: border-box;
  }
  #history-log {
    list-style: none;
    margin: 0;
    padding: 0;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    line-height: 1.7;
  }
  #history-log li { display: flex; gap: 8px; opacity: 0.9; }
  #history-log li span.num { color: var(--gold); width: 22px; flex-shrink: 0; }
  #history-log li span.mv { min-width: 68px; }

  /* ------------------------------------------------------------ */
  /* 操作按钮：悔棋 / 和棋 / 认输                                        */
  /* ------------------------------------------------------------ */
  .action-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    width: 100%;
    box-sizing: border-box;
  }
  .action-btn-wrap {
    position: relative;
    flex: 1;
  }
  .icon-btn {
    width: 100%;
    padding: 10px 0;
    font-size: 18px;
    background: var(--ink-raised);
    color: var(--parchment-light);
    border: 1px solid var(--gold);
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.12s, opacity 0.12s;
  }
  .icon-btn:hover { background: rgba(184,148,75,0.25); }
  .action-btn-wrap.armed .icon-btn {
    background: var(--gold);
    color: var(--ink);
  }
  .action-btn-wrap.disabled-action .icon-btn {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }
  .cancel-x {
    display: none;
    position: absolute;
    top: -8px; right: -8px;
    width: 20px; height: 20px;
    padding: 0;
    line-height: 18px;
    font-size: 12px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    border: 1px solid var(--ink);
    cursor: pointer;
  }
  .action-btn-wrap.armed .cancel-x { display: block; }
  .action-btn-wrap .badge-soon {
    position: absolute;
    bottom: -6px; left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    white-space: nowrap;
    color: var(--gold);
    opacity: 0.6;
  }

  .offer-banner {
    display: none;
    font-size: 12px;
    text-align: center;
    padding: 6px 8px;
    border: 1px solid var(--gold);
    border-radius: 4px;
    background: var(--gold-soft);
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .offer-banner .agree {
    background: #4c8c4c; color: #fff; border: none;
    border-radius: 3px; padding: 3px 10px; font-size: 12px; cursor: pointer;
  }
  .offer-banner .deny {
    background: var(--danger); color: #fff; border: none;
    border-radius: 3px; padding: 3px 10px; font-size: 12px; cursor: pointer;
  }

  /* ------------------------------------------------------------ */
  /* 棋盘 + 吃子栏                                                    */
  /* ------------------------------------------------------------ */
  .captured-row {
    display: flex;
    align-items: center;
    gap: 3px;
    min-height: 24px;
    max-width: 726px;
    flex-wrap: wrap;
  }
  .piece-chip {
    width: 26px; height: 26px;
    flex-shrink: 0;
    object-fit: contain;
  }
  /* 兵之间排得更紧凑一些 */
  .piece-chip.pawn-chip { width: 21px; height: 21px; margin-left: -7px; }

  #board-wrap {
    position: relative;   /* 终局弹窗要相对这个容器居中，见 #result-overlay */
    max-width: 92vw;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    outline: none;
  }
  canvas#board {
    background: var(--parchment-light);
    max-width: 100%;
    height: auto;
    cursor: pointer;
    /* 移动端点击默认会闪一下半透明蓝色高亮，体验很差，这里关掉。
       同时在 canvas 和它的外层容器都设置，避免只设一层不生效。
       touch-action:manipulation 顺带禁掉双击缩放，避免快速点两下棋子
       被浏览器当成"想放大"而吞掉第二次点击。 */
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    -webkit-touch-callout: none;
    touch-action: manipulation;
    outline: none;
    user-select: none;
  }

  #message-line {
    font-size: 15px;
    font-weight: 600;
    min-height: 22px;
    color: var(--gold);
    margin-top: 6px;
    text-align: center;
  }

  /* ---------------------------------------------------------------- */
  /* 终局结算弹窗：居中悬浮，带遮罩，独立于网格布局之外                    */
  /* ---------------------------------------------------------------- */
  #result-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  #result-overlay.open { display: flex; }
  #result-panel {
    text-align: center;
    background: var(--ink-raised);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 24px 28px;
    min-width: 260px;
    max-width: 90vw;
  }
  #result-icon { margin: 0 auto 10px; width: 48px; height: 48px; color: var(--parchment-light); }
  #result-icon svg { width: 100%; height: 100%; }
  #result-panel .result-text {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  /* 跟 database 页面用同一套配色：黑胜金色 / 白胜白色 / 和棋青铜色 */
  #result-panel .result-text.outcome-black { color: #d9a441; }
  #result-panel .result-text.outcome-white { color: #f0ece1; }
  #result-panel .result-text.outcome-draw  { color: #9c8f6b; }
  #result-players { margin-bottom: 16px; font-size: 13px; }
  #result-players .rp-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 3px 0;
  }
  #result-players .rp-rating { color: var(--gold); }
  #result-players .rp-delta { font-size: 11px; font-weight: 700; }
  #result-players .rp-delta.up { color: #6fae6f; }
  #result-players .rp-delta.down { color: var(--cinnabar); }
  #result-panel .result-actions { display: flex; flex-direction: column; gap: 8px; }
  #result-panel button {
    padding: 8px 16px; font-size: 13px;
    background: var(--parchment-light); color: var(--ink);
    border: 1px solid var(--gold); border-radius: 3px; cursor: pointer;
  }

  #waiting-panel {
    display: none;
    text-align: center;
    margin-top: 8px;
    padding: 10px 16px;
    border: 1px solid var(--gold);
    border-radius: 4px;
    background: var(--gold-soft);
  }
  #waiting-panel button {
    margin-top: 8px;
    padding: 8px 18px;
    background: var(--gold);
    color: var(--ink);
    border: none;
    border-radius: 3px;
    font-weight: 700;
    cursor: pointer;
  }

  /* 棋谱导航：⏮ ◀ ▶ ⏭ */
  .nav-row { display: flex; gap: 6px; }
  .nav-btn {
    flex: 1;
    padding: 6px 0;
    font-size: 13px;
    background: var(--ink-raised);
    color: var(--parchment-light);
    border: 1px solid var(--gold);
    border-radius: 4px;
    cursor: pointer;
  }
  .nav-btn:hover:not(:disabled) { background: rgba(184,148,75,0.25); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* "轮到你了 / 回到当前局面" 横幅 */
  .turn-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    padding: 6px 8px;
    border: 1px solid var(--gold);
    border-radius: 4px;
    background: var(--gold-soft);
  }
  .turn-banner button {
    background: #4c8c4c; color: #fff; border: none;
    border-radius: 3px; padding: 3px 12px; font-size: 13px; cursor: pointer;
  }

  /* 走子记录：可点击跳转，当前所看的那一步高亮 */
  #history-log li span.mv {
    cursor: pointer;
    padding: 0 3px;
    border-radius: 2px;
  }
  #history-log li span.mv:hover { background: rgba(184,148,75,0.2); }
  #history-log li span.mv.current {
    background: var(--gold);
    color: var(--ink);
    font-weight: 700;
  }

  #replay-exit-row { display: none; margin-top: 10px; text-align: center; }
  #replay-exit-row button {
    padding: 6px 14px; background: var(--parchment-light); color: var(--ink);
    border: 1px solid var(--gold); border-radius: 3px; cursor: pointer;
  }

  #replay-bar {
    display: none;
    margin-top: 10px;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 13px;
  }
  #replay-bar button {
    padding: 6px 12px; background: var(--parchment-light); color: var(--ink);
    border: 1px solid var(--gold); border-radius: 3px; cursor: pointer;
  }

  /* ------------------------------------------------------------ */
  /* 右栏：对局信息 + 聊天室                                            */
  /* ------------------------------------------------------------ */
  .game-info-card .row {
    display: flex; justify-content: space-between;
    font-size: 13px; padding: 3px 0;
  }
  .game-info-card .tc-line {
    font-size: 15px; font-weight: 700; color: var(--gold);
    margin-bottom: 8px;
  }
  .game-info-card .player-line {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; padding: 3px 0;
  }
  .side-icon { flex-shrink: 0; vertical-align: -2px; }
  .side-icon-black { color: var(--parchment-light); }
  .side-icon-white { color: var(--parchment-light); }

  .chat-card { display: flex; flex-direction: column; height: 340px; }
  .chat-card h2 { flex-shrink: 0; }
  #chat-messages {
    flex: 1; overflow-y: auto; font-size: 13px; line-height: 1.6;
    margin-bottom: 8px; opacity: 0.85;
  }
  #chat-messages .empty-note { opacity: 0.6; font-size: 12px; }
  #chat-input-row { display: flex; gap: 6px; }
  #chat-input {
    flex: 1; padding: 7px 8px; font-size: 13px;
    background: var(--parchment-light); color: var(--ink);
    border: 1px solid var(--gold); border-radius: 3px;
  }
  #chat-input:disabled { opacity: 0.5; cursor: not-allowed; }
  #chat-input-row button {
    padding: 7px 12px; background: var(--parchment-light); color: var(--ink);
    border: 1px solid var(--gold); border-radius: 3px; cursor: not-allowed; opacity: 0.5;
  }

  .account-mini {
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .account-mini input {
    padding: 6px 8px; font-size: 13px;
    background: var(--parchment-light); color: var(--ink);
    border: 1px solid var(--gold); border-radius: 3px;
  }
  .account-mini .row-btns { display: flex; gap: 6px; }
  .account-mini button {
    flex: 1; padding: 6px 0; font-size: 12px;
    background: var(--parchment-light); color: var(--ink);
    border: 1px solid var(--gold); border-radius: 3px; cursor: pointer;
  }

  /* ---------------------------------------------------------------- */
  /* 手机端断点：单列重排，棋谱改成横向卷带，汉堡菜单登场                  */
  /* ---------------------------------------------------------------- */
  @media (max-width: 760px) {
    header.top-bar .brand { font-size: 15px; margin-left: 36px; }
    header.top-bar .right-info { display: none; }

    .m-menu-btn {
      display: block;
      position: fixed;
      left: 12px; top: 10px;
      background: none; border: none;
      color: var(--parchment-light);
      font-size: 22px;
      cursor: pointer;
      z-index: 41;
    }
    #m-drawer, #m-drawer-backdrop { display: block; }
    #m-drawer-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 39;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #m-drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .table-layout {
      grid-template-columns: 1fr;
      grid-template-areas:
        "top-card"
        "board"
        "bottom-card"
        "move-nav"
        "banners"
        "actions"
        "info-chat";
      padding: 10px 8px 40px;
      gap: 10px;
    }

    .player-card { padding: 7px 10px; }
    .player-card .name-row { margin-bottom: 4px; font-size: 13px; }
    .clock-box .time { font-size: 18px; }
    .clock-box { padding: 4px 8px; }

    /* 棋谱横向卷带：固定宽度，不换行，超出部分靠滚动查看，
       而不是让文本无限往右撑开容器（这才是"卷尺"式效果的关键——
       容器本身宽度锁死，新招法出现时旧招法自然被滚动挤到看不见的地方，
       不是容器本身在变宽）。 */
    .area-move-nav .move-list-card {
      max-height: none;
      overflow: hidden;
      padding: 6px 8px;
      width: 100%;
      box-sizing: border-box;
    }
    .area-move-nav #history-log {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      scroll-behavior: smooth;
      gap: 8px;              /* 招法间距缩小 */
      width: 100%;
      box-sizing: border-box;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .area-move-nav #history-log::-webkit-scrollbar { display: none; }
    .area-move-nav #history-log li {
      display: flex;
      gap: 4px;               /* 招法间距缩小 */
      flex-shrink: 0;
      white-space: nowrap;
    }
    /* 手机上不需要桌面那种"每步至少留68px对齐"的规则，
       让招法紧凑排列，一屏能看到更多步 */
    .area-move-nav #history-log li span.mv { min-width: 0; }

    .area-actions .icon-btn { padding: 8px 0; font-size: 16px; }

    .area-info-chat { padding-top: 4px; }
    .chat-card { height: 220px; }

    #result-panel { min-width: 220px; padding: 20px; }
  }
</style>
</head>
<body>

<header class="top-bar">
  <a class="brand" href="index.html">古 戰 棋　ARKATANA</a>
  <button id="btn-quit-single" style="display:none;" title="退出，不保留这局记录">✕ Quit</button>
  <div class="right-info">
    <span id="auth-status-mini">未登录</span>
    <span id="game-id-chip">对局: -</span>
  </div>
</header>

<div class="table-layout">

  <button class="m-menu-btn" id="btn-mobile-menu" title="菜单">☰</button>

  <!-- 抽屉导航（仅手机版通过汉堡按钮打开） -->
  <div id="m-drawer-backdrop"></div>
  <nav id="m-drawer">
    <ul>
      <li><a href="index.html">play</a></li>
      <li><a href="#">studies</a></li>
      <li><a href="#">openings</a></li>
      <li><a href="database.html">database</a></li>

<script src="pieces.js"></script>
<script src="shared.js"></script>
<script>
(() => {
  "use strict";

  // -------------------------------------------------------------------
  // 棋盘几何常量（需与 board.py 的坐标系统保持一致：a~k / 1~12）
  // -------------------------------------------------------------------
  const COLS = "abcdefghjkl";  // 跳过 i，避免与 j 混淆
  const MIN_ROW = 1;
  const MAX_ROW = 12;
  const CELL = 66;   // 格子再放大一点
  const MARGIN = 0;  // 无外框，坐标直接画进棋盘格内

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");

  const COLORS = {
    ink: "#1b1b1e",
    parchLight: "#ede3c8",
    parchDark: "#cbb98d",
    cinnabar: "#a6362b",
    jade: "#3f6656",
    gold: "#e0a92a",   // 高饱和金色（选中格描边用）
    lastMove: "rgba(228, 166, 103, 0.55)",   // 走棋提示：饱和度70%的浅橙色
    checkGlow: "rgba(196, 45, 45, 0.55)",
  };

  // 棋子记谱字母 -> 中文符号（跟 pieces.py 的 symbol 保持一致），吃子栏用
  const PIECE_SYMBOLS = { "": "兵", B: "弩", T: "炮", A: "将", H: "轻", N: "重", R: "塔", P: "凤", S: "剑", C: "战" };
  // 吃子展示顺序：Rook-Ares-Phoenix-Knight-Turret-Chariot-Hussar-Ballista-Swordsman-Pawns
  const CAPTURE_ORDER = ["R", "A", "P", "N", "T", "C", "H", "B", "S", ""];
  const STARTING_COUNTS = { R: 2, A: 1, P: 2, N: 2, T: 2, C: 2, H: 2, B: 2, S: 2, "": 11 };

  // -------------------------------------------------------------------
  // 状态
  // -------------------------------------------------------------------
  let gameId = null;
  let boardState = {};
  let currentSide = "black";
  let gameResult = "ongoing";
  let selected = null;
  let legalDestinations = [];
  let legalMovesMap = {};     // 当前行棋方全部合法走法：{起点: [终点,...]}，随状态更新
  let historyEntries = [];
  let boardFlipped = false;
  let mySide = null;          // "black" | "white" | null（我在这局里是哪一方；null=旁观/身份未知）
  let inCheck = false;
  let lastMoveFrom = null;
  let lastMoveTo = null;
  let armedAction = null;     // "undo" | "draw" | "resign" | null

  // 走子动画：所有棋子从起点滑到终点固定 0.4 秒
  const ANIM_MS = 400;
  let anim = null;            // { fromSq, toSq, movingInfo, capturedInfo, startedAt }
  let animRaf = null;
  let prevBoardState = null;     // 上一帧的棋盘，用来对比出"这一步是谁走的、吃了什么"
  // 乐观更新：点击后先在本地把这步棋走掉（立刻出画面和音效），
  // 不等服务器往返。记下这步棋，等服务器的权威状态回来时用它做两件事：
  //   1) 认出"这就是我刚才那一步"，避免动画和音效被重复播一遍
  //   2) 万一服务器拒绝了，用快照把画面回滚回去
  let optimisticMove = null;
  // 每格棋子当前用的是左版还是右版。走到正中 f 线时不翻面，
  // 需要靠这张表把"原来的朝向"带过去。
  let orientationBySquare = {};

  // 统一的"棋谱历史浏览"机制——对局中回看和复盘用的是同一套：
  //   positionHistory[i] = 走完第 i 步之后的棋盘（i=0 就是开局初始局面）
  //   moveMeta[i]        = 第 i 步的信息（i 从 1 开始，与 positionHistory 对齐）
  //   viewIndex          = 当前正在看第几步；null 表示"跟着最新局面走"
  let positionHistory = [];
  let moveMeta = [];
  let viewIndex = null;
  let replayOnly = false;   // true = 纯复盘页面（没有实时对局），进来就是只读
  let singleMode = false;   // true = Single game（本机双人对战），界面精简、不认领任何一方
  let lastEndReason = null; // 这局是怎么结束的（resigned/checkmate/timedout/...）

  let authToken = localStorage.getItem("arkatana_token") || null;
  let authUsername = localStorage.getItem("arkatana_username") || null;


  const authStatusMiniEl = document.getElementById("auth-status-mini");

  const gameIdChip = document.getElementById("game-id-chip");
  const messageEl = document.getElementById("message-line");
  const historyEl = document.getElementById("history-log");
  const resultPanelEl = document.getElementById("result-panel");
  const resultTextEl = document.getElementById("result-text");

  const ratingCache = {};

  // -------------------------------------------------------------------
  // 音效
  //   己方走棋 move.mp3 / 对方走棋 move-2.mp3 / 吃子 capture_2.mp3
  //   将军·将杀 check.mp3
  // 说明：浏览器要求页面被交互过才允许播声音，所以首次点击时解锁一次；
  // 另外同一个 Audio 元素连续播放会互相打断，这里每次播放都克隆一份，
  // 保证连续走棋时不会出现"该响的时候没响"。
  // -------------------------------------------------------------------
  const SOUNDS = {
    moveSelf:  new Audio("sounds/move.mp3"),
    moveOther: new Audio("sounds/move-2.mp3"),
    capture:   new Audio("sounds/capture_2.mp3"),
    check:     new Audio("sounds/check.mp3"),
    checkmate: new Audio("sounds/checkmate.mp3"),
  };
  Object.values(SOUNDS).forEach((a) => { a.preload = "auto"; a.volume = 0.85; });

  let audioUnlocked = false;
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    // 静音播放一次再立刻暂停，用这次用户手势换取后续自动播放的许可
    Object.values(SOUNDS).forEach((a) => {
      const p = a.play();
      if (p && p.then) p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
    });
  }
  document.addEventListener("pointerdown", unlockAudio, { once: true });
  document.addEventListener("keydown", unlockAudio, { once: true });

  function playSound(key) {
    const base = SOUNDS[key];
    if (!base) return;
    const clip = base.cloneNode();   // 克隆播放，避免连续走棋时互相打断
    clip.volume = base.volume;
    const p = clip.play();
    if (p && p.catch) p.catch(() => {});   // 还没解锁时静默失败，不打断下棋
  }

  // -------------------------------------------------------------------
  // 坐标 <-> 像素 转换
  // -------------------------------------------------------------------
  function colIndex(letter) { return COLS.indexOf(letter); }

  function squareTopLeft(col, row) {
    const displayCol = boardFlipped ? (COLS.length - 1 - col) : col;
    const displayRowIndex = boardFlipped ? (row - MIN_ROW) : (MAX_ROW - row);
    const x = MARGIN + displayCol * CELL;
    const y = MARGIN + displayRowIndex * CELL;
    return [x, y];
  }

  function pixelToSquare(px, py) {
    const displayCol = Math.floor((px - MARGIN) / CELL);
    const displayRowIndex = Math.floor((py - MARGIN) / CELL);
    const col = boardFlipped ? (COLS.length - 1 - displayCol) : displayCol;
    const row = boardFlipped ? (displayRowIndex + MIN_ROW) : (MAX_ROW - displayRowIndex);
    if (col < 0 || col >= COLS.length || row < MIN_ROW || row > MAX_ROW) return null;
    return COLS[col] + row;
  }

  function squareToPixelCenter(sq) {
    const col = colIndex(sq[0]);
    const row = parseInt(sq.slice(1), 10);
    const [x, y] = squareTopLeft(col, row);
    return [x + CELL / 2, y + CELL / 2];
  }

  // -------------------------------------------------------------------
  // 绘制
  // -------------------------------------------------------------------
  function drawBoard() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let row = MIN_ROW; row <= MAX_ROW; row++) {
      for (let c = 0; c < COLS.length; c++) {
        const [x, y] = squareTopLeft(c, row);
        const isDark = (c + row) % 2 === 0;
        ctx.fillStyle = isDark ? COLORS.parchDark : COLORS.parchLight;
        ctx.fillRect(x, y, CELL, CELL);
      }
    }

    // 上一步棋高亮（起点+终点，低饱和金色）
    if (lastMoveFrom) fillSquare(lastMoveFrom, COLORS.lastMove);
    if (lastMoveTo) fillSquare(lastMoveTo, COLORS.lastMove);

    // 将军红光：找到当前行棋方的王城格子
    if (inCheck) {
      const throneSq = Object.entries(boardState).find(
        ([, info]) => info.piece === "TH" && info.side === currentSide
      );
      if (throneSq) drawCheckGlow(throneSq[0]);
    }

    // 网格线
    ctx.strokeStyle = "rgba(27,27,30,0.25)";
    ctx.lineWidth = 1;
    for (let c = 0; c <= COLS.length; c++) {
      const x = MARGIN + c * CELL;
      ctx.beginPath();
      ctx.moveTo(x, MARGIN);
      ctx.lineTo(x, MARGIN + (MAX_ROW - MIN_ROW + 1) * CELL);
      ctx.stroke();
    }
    for (let r = 0; r <= (MAX_ROW - MIN_ROW + 1); r++) {
      const y = MARGIN + r * CELL;
      ctx.beginPath();
      ctx.moveTo(MARGIN, y);
      ctx.lineTo(MARGIN + COLS.length * CELL, y);
      ctx.stroke();
    }

    // 坐标标签：直接画在棋盘格内（不再有外框）
    //   纵坐标 -> 最左一列格子的左上角
    //   横坐标 -> 最底一行格子的右上角
    ctx.fillStyle = "rgba(60, 52, 36, 0.62)";
    ctx.font = "bold 11px Consolas, monospace";

    const leftmostCol = boardFlipped ? (COLS.length - 1) : 0;
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    for (let row = MIN_ROW; row <= MAX_ROW; row++) {
      const [x, y] = squareTopLeft(leftmostCol, row);
      ctx.fillText(String(row), x + 3, y + 3);
    }

    const bottomRow = boardFlipped ? MAX_ROW : MIN_ROW;
    ctx.textAlign = "right";
    ctx.textBaseline = "top";
    for (let c = 0; c < COLS.length; c++) {
      const [x, y] = squareTopLeft(c, bottomRow);
      ctx.fillText(COLS[c], x + CELL - 3, y + 3);
    }

    if (selected) highlightSquare(selected, COLORS.gold, 3);
    legalDestinations.forEach((sq) => {
      const occupied = !!boardState[sq];
      drawMoveHint(sq, occupied);
    });

    Object.entries(boardState).forEach(([sq, info]) => {
      // 正在做移动动画的那枚棋子，先不画在终点格，等下按动画位置画
      if (anim && anim.toSq === sq) return;
      drawPiece(sq, info);
    });

    // 被吃的棋子留在原地，等动画走完才消失（规格要求）
    if (anim && anim.capturedInfo) {
      drawPiece(anim.toSq, anim.capturedInfo);
    }

    // 移动中的棋子画在插值出来的位置上
    if (anim) {
      const t = Math.min(1, (performance.now() - anim.startedAt) / ANIM_MS);
      // easeOutCubic：起步快、落子稳，手感更像真的把棋子放下去
      const eased = 1 - Math.pow(1 - t, 3);
      const [fx, fy] = squareToPixelCenter(anim.fromSq);
      const [tx, ty] = squareToPixelCenter(anim.toSq);
      const cx = fx + (tx - fx) * eased;
      const cy = fy + (ty - fy) * eased;
      drawPiece(anim.toSq, anim.movingInfo, [cx, cy]);
    }
  }

  function fillSquare(sq, color) {
    const col = colIndex(sq[0]);
    const row = parseInt(sq.slice(1), 10);
    const [x, y] = squareTopLeft(col, row);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, CELL, CELL);
  }

  function drawCheckGlow(sq) {
    const [cx, cy] = squareToPixelCenter(sq);
    const grad = ctx.createRadialGradient(cx, cy, CELL * 0.15, cx, cy, CELL * 1.1);
    grad.addColorStop(0, COLORS.checkGlow);
    grad.addColorStop(1, "rgba(196, 45, 45, 0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 1.1, 0, Math.PI * 2);
    ctx.fill();
  }

  function highlightSquare(sq, color, width) {
    const col = colIndex(sq[0]);
    const row = parseInt(sq.slice(1), 10);
    const [x, y] = squareTopLeft(col, row);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.strokeRect(x + width / 2, y + width / 2, CELL - width, CELL - width);
  }

  function drawMoveHint(sq, occupied) {
    const [cx, cy] = squareToPixelCenter(sq);
    if (occupied) {
      ctx.strokeStyle = COLORS.gold;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, CELL / 2 - 4, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = COLORS.gold;
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /**
   * 重算每格棋子的朝向。
   * 规则：一般按显示位置定（左半屏朝右、右半屏朝左，始终朝向屏幕中心）；
   * 走到正中 f 线的棋子不翻面——继承它从哪一格来的朝向。
   */
  function updateOrientations(board, fromSq, toSq) {
    const P = window.ArkatanaPieces;
    if (!P) return;
    const next = {};
    Object.keys(board).forEach((sq) => {
      // 这一步刚落到 f 线的棋子，把起点格的朝向带过来
      let sticky = orientationBySquare[sq];
      if (toSq === sq && fromSq && orientationBySquare[fromSq]) {
        sticky = orientationBySquare[fromSq];
      }
      next[sq] = P.resolveVariant(sq, boardFlipped, sticky);
    });
    orientationBySquare = next;
  }

  function drawPiece(sq, info, overrideCenter) {
    const [cx, cy] = overrideCenter || squareToPixelCenter(sq);
    const P = window.ArkatanaPieces;
    // 按棋子在屏幕上的显示位置选左版/右版素材（跟视角翻转联动），
    // 走到正中 f 线时沿用原朝向，不突兀翻面；升变了就直接换成专门的
    // 升变造型素材（黑方铜色/白方金色），瞬间切换，不再叠加描边效果
    const img = P
      ? P.getImage(info.piece, info.side, sq, boardFlipped, orientationBySquare[sq], info.promoted)
      : null;

    if (img) {
      // 素材是正方形画布里的居中造型，按各棋子的比例等比缩放画上去
      const size = CELL * (P ? P.pieceScale(info.piece) : 0.9);
      ctx.drawImage(img, cx - size / 2, cy - size / 2, size, size);
      return;
    }

    // 素材还没画好/还没加载完时的占位画法，避免棋盘一片空白
    const r = CELL / 2 - 6;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = info.side === "black" ? COLORS.cinnabar : COLORS.jade;
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = COLORS.ink;
    ctx.stroke();
    if (info.promoted) {
      ctx.beginPath();
      ctx.arc(cx, cy, r + 4, 0, Math.PI * 2);
      ctx.strokeStyle = COLORS.gold;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.fillStyle = COLORS.parchLight;
    ctx.font = "bold 20px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(info.symbol || "?", cx, cy + 1);
  }


  // -------------------------------------------------------------------
  // 吃子栏
  // -------------------------------------------------------------------
  function computeCaptured(board) {
    const onBoard = { black: {}, white: {} };
    Object.values(board).forEach((info) => {
      if (info.piece === "TH") return;
      const key = info.piece || "";
      onBoard[info.side][key] = (onBoard[info.side][key] || 0) + 1;
    });
    const capturedByBlack = [];
    const capturedByWhite = [];
    CAPTURE_ORDER.forEach((type) => {
      const start = STARTING_COUNTS[type];
      const whiteLeft = onBoard.white[type] || 0;
      const blackLeft = onBoard.black[type] || 0;
      for (let i = 0; i < start - whiteLeft; i++) capturedByBlack.push(type);
      for (let i = 0; i < start - blackLeft; i++) capturedByWhite.push(type);
    });
    return { black: capturedByBlack, white: capturedByWhite };
  }

  function renderCapturedRow(elId, pieces, capturedSide) {
    const el = document.getElementById(elId);
    el.innerHTML = "";
    const P = window.ArkatanaPieces;
    pieces.forEach((type) => {
      // 用真正的棋子造型渲染，不再用圆形图案
      const path = P ? P.pieceImagePath(type, capturedSide, "a1", false) : null;
      const chip = document.createElement("img");
      chip.className = "piece-chip" + (type === "" ? " pawn-chip" : "");
      if (path) chip.src = path;
      chip.alt = PIECE_SYMBOLS[type];
      chip.title = PIECE_SYMBOLS[type];
      el.appendChild(chip);
    });
  }

  function renderCaptured() {
    const captured = computeCaptured(boardState);
    const topSide = boardFlipped ? "black" : "white";
    const bottomSide = boardFlipped ? "white" : "black";
    // 顶部一栏显示"顶部玩家吃掉的棋子"（也就是对方阵营颜色的棋子）
    renderCapturedRow("captured-top", captured[topSide], topSide === "black" ? "white" : "black");
    renderCapturedRow("captured-bottom", captured[bottomSide], bottomSide === "black" ? "white" : "black");
  }

  // -------------------------------------------------------------------
  // 走子记录
  // -------------------------------------------------------------------
  function renderHistory() {
    historyEl.innerHTML = "";
    const current = effectiveIndex();   // 当前正在看第几步，用来高亮
    for (let i = 0; i < historyEntries.length; i += 2) {
      const num = Math.floor(i / 2) + 1;
      const li = document.createElement("li");

      const numSpan = document.createElement("span");
      numSpan.className = "num";
      numSpan.textContent = num + ".";
      li.appendChild(numSpan);

      // 每半步都可以点击直接跳过去；棋谱下标从1开始，与 positionHistory 对齐
      [i, i + 1].forEach((entryIdx) => {
        const span = document.createElement("span");
        span.className = "mv";
        const text = historyEntries[entryIdx];
        span.textContent = text || "";
        if (text) {
          const stepIndex = entryIdx + 1;
          if (stepIndex === current) span.classList.add("current");
          span.addEventListener("click", () => gotoIndex(stepIndex));
        }
        li.appendChild(span);
      });

      historyEl.appendChild(li);
    }
    // 跟着最新局面时，把"当前步"滚动到可见范围——
    // 桌面端棋谱是纵向列表，手机端是横向卷带，用 scrollIntoView 一次处理
    // 两种情况，不用分别写 scrollTop / scrollLeft。
    // 正在回看历史时，交互本身（点击/翻页）已经会把目标步带到可见范围，
    // 这里加 nearest 也不会打断视线。
    const currentEl = historyEl.querySelector(".mv.current");
    if (currentEl) {
      currentEl.scrollIntoView({ block: "nearest", inline: "center" });
    }
  }

  // -------------------------------------------------------------------
  // 操作按钮：悔棋 / 和棋 / 认输（点击→高亮+"×" → 再点确认；点"×"取消）
  // -------------------------------------------------------------------
  function renderActionButtons() {
    ["undo", "draw", "resign"].forEach((a) => {
      document.getElementById("action-" + a).classList.toggle("armed", armedAction === a);
    });
    // rated 对局禁用悔棋
    document.getElementById("action-undo").classList.toggle("disabled-action", !!currentStateRated);
  }

  function renderOfferBanner(offer) {
    const el = document.getElementById("offer-banner");
    if (singleMode || !offer || gameResult !== "ongoing") {
      el.style.display = "none";
      el.innerHTML = "";
      return;
    }
    const label = offer.kind === "draw" ? "offers draw" : "offers retake";

    if (mySide && offer.from === mySide) {
      // 自己发出的申请：只显示等待状态，没有同意/拒绝按钮
      el.style.display = "flex";
      el.innerHTML = `<span>你已 ${label}，等待对手回应…</span>`;
      return;
    }

    // 对方发来的申请：显示同意/拒绝
    el.style.display = "flex";
    el.innerHTML = `<span>- ${label}</span>`;
    const agree = document.createElement("button");
    agree.className = "agree";
    agree.textContent = "agree";
    agree.addEventListener("click", () => respondToOffer(true));
    const deny = document.createElement("button");
    deny.className = "deny";
    deny.textContent = "deny";
    deny.addEventListener("click", () => respondToOffer(false));
    el.appendChild(agree);
    el.appendChild(deny);
  }

  function armOrConfirm(action, confirmFn) {
    if (armedAction === action) {
      armedAction = null;
      renderActionButtons();
      confirmFn();
    } else {
      armedAction = action;
      renderActionButtons();
    }
  }

  function disarm() {
    armedAction = null;
    renderActionButtons();
  }

  let currentStateRated = false;

  document.getElementById("btn-undo").addEventListener("click", () => {
    if (currentStateRated) return; // rated 对局不能悔棋
    armOrConfirm("undo", confirmUndo);
  });
  document.getElementById("cancel-undo").addEventListener("click", (e) => { e.stopPropagation(); disarm(); });

  document.getElementById("btn-draw").addEventListener("click", () => {
    armOrConfirm("draw", confirmDraw);
  });
  document.getElementById("cancel-draw").addEventListener("click", (e) => { e.stopPropagation(); disarm(); });

  document.getElementById("btn-resign").addEventListener("click", () => {
    armOrConfirm("resign", confirmResign);
  });
  document.getElementById("cancel-resign").addEventListener("click", (e) => { e.stopPropagation(); disarm(); });

  async function confirmUndo() {
    // 悔棋现在是"发申请、等对方同意"，不再是自己直接退回
    try {
      const state = await apiPost(`/games/${gameId}/offer`, { kind: "retake" });
      handleIncomingState(state);
      setMessage("已发出悔棋申请，等待对手回应…");
    } catch (err) {
      setMessage(err.message);
    }
  }

  async function confirmDraw() {
    try {
      const state = await apiPost(`/games/${gameId}/offer`, { kind: "draw" });
      handleIncomingState(state);
      setMessage("已发出和棋申请，等待对手回应…");
    } catch (err) {
      setMessage(err.message);
    }
  }

  async function respondToOffer(accept) {
    try {
      const state = await apiPost(`/games/${gameId}/offer/respond`, { accept });
      handleIncomingState(state);
      setMessage(accept ? "已接受对方的申请。" : "已拒绝对方的申请。");
    } catch (err) {
      setMessage(err.message);
    }
  }

  async function confirmResign() {
    if (gameResult !== "ongoing") { setMessage("对局已结束"); return; }
    if (!mySide) { setMessage("你不是这局对局的玩家，无法认输"); return; }
    try {
      const state = await apiPost(`/games/${gameId}/resign`, { side: mySide });
      handleIncomingState(state);
      setMessage((mySide === "black" ? "黑方" : "白方") + "已认输。");
    } catch (err) {
      setMessage("操作失败：" + err.message);
    }
  }

  // -------------------------------------------------------------------
  // 棋谱历史浏览（对局中回看 与 复盘 共用同一套机制）
  // -------------------------------------------------------------------
  const turnBannerEl = document.getElementById("turn-banner");

  /** 当前正在看的是第几步（viewIndex 为 null 时就是最新一步） */
  function effectiveIndex() {
    const last = Math.max(0, positionHistory.length - 1);
    return viewIndex === null ? last : Math.min(viewIndex, last);
  }

  /** 是否正在回看历史（而不是停在最新局面） */
  function isBrowsingHistory() {
    return viewIndex !== null && viewIndex < positionHistory.length - 1;
  }

  /**
   * 跳到第 index 步；传 null 表示回到最新局面并恢复自动跟随。
   * 如果是"往前走一步"（不是跳跃、也不是后退），就播放动画和音效，
   * 让复盘/回看跟真的在下棋一样有反馈。
   */
  function gotoIndex(index) {
    const last = Math.max(0, positionHistory.length - 1);
    const before = effectiveIndex();
    const target = (index === null || index >= last) ? last : Math.max(0, index);
    const steppingForward = target === before + 1;

    viewIndex = (index === null || index >= last) ? null : Math.max(0, index);

    if (steppingForward && target > 0) {
      playHistoryStep(target);
    } else {
      renderCurrentView();
    }
  }

  /** 把第 stepIndex 步"演"出来：滑动动画 + 对应音效 */
  function playHistoryStep(stepIndex) {
    const meta = moveMeta[stepIndex];
    const prevBoard = positionHistory[stepIndex - 1];
    const nextBoard = positionHistory[stepIndex];
    if (!meta || !prevBoard || !nextBoard || !meta.from_sq || !meta.to_sq) {
      renderCurrentView();
      return;
    }

    // 先把静态部分（棋谱高亮、导航按钮等）刷新到位
    boardState = nextBoard;
    lastMoveFrom = meta.from_sq;
    lastMoveTo = meta.to_sq;
    inCheck = false;
    selected = null;
    legalDestinations = [];
    updateOrientations(nextBoard, meta.from_sq, meta.to_sq);
    renderHistory();
    renderNavButtons();
    renderTurnBanner();

    const detected = detectMove(prevBoard, nextBoard, meta.from_sq, meta.to_sq);
    prevBoardState = nextBoard;
    if (!detected) { renderCurrentView(); return; }

    // 最后一步且这局是被绝杀结束的，就用绝杀音效收尾
    const isLastStep = stepIndex === positionHistory.length - 1;
    const isMate = isLastStep && gameResult !== "ongoing" && lastEndReason === "checkmate";
    startMoveAnimation(detected, meta.side, false, isMate);
  }

  /** 按当前 viewIndex 把棋盘、吃子栏、棋谱高亮、导航按钮全部刷新一遍 */
  function renderCurrentView() {
    const idx = effectiveIndex();
    if (positionHistory.length === 0) return;

    boardState = positionHistory[idx] || {};

    // 回看历史时，高亮"这一步"走的两格；停在开局则不高亮
    const meta = idx > 0 ? moveMeta[idx] : null;
    lastMoveFrom = meta ? meta.from_sq : null;
    lastMoveTo = meta ? meta.to_sq : null;

    // 回看历史时不显示将军红光（那是针对最新局面的判断），也不能选子
    if (isBrowsingHistory()) {
      inCheck = false;
      selected = null;
      legalDestinations = [];
    }

    // 跳步浏览不该有滑动动画，清掉可能残留的动画状态
    anim = null;
    if (animRaf) { cancelAnimationFrame(animRaf); animRaf = null; }
    prevBoardState = boardState;

    drawBoard();
    renderCaptured();
    renderHistory();
    renderNavButtons();
    renderTurnBanner();
  }

  function renderNavButtons() {
    const idx = effectiveIndex();
    const last = Math.max(0, positionHistory.length - 1);
    document.getElementById("btn-nav-first").disabled = idx <= 0;
    document.getElementById("btn-nav-prev").disabled = idx <= 0;
    document.getElementById("btn-nav-next").disabled = idx >= last;
    document.getElementById("btn-nav-last").disabled = idx >= last;
  }

  /**
   * 回看历史时提示"可以回到当前局面"。
   * 轮到自己走棋时用规格里的 "its your turn now" 文案，
   * 否则只提示可以回到最新局面（这时候说"轮到你了"是不准确的）。
   */
  function renderTurnBanner() {
    if (singleMode || replayOnly || !isBrowsingHistory() || gameResult !== "ongoing") {
      turnBannerEl.style.display = "none";
      turnBannerEl.innerHTML = "";
      return;
    }
    const myTurn = mySide && currentSide === mySide;
    turnBannerEl.style.display = "flex";
    turnBannerEl.innerHTML = `<span>${myTurn ? "its your turn now" : "已回看历史局面"}</span>`;
    const btn = document.createElement("button");
    btn.textContent = "→";
    btn.title = "回到当前进行中的局面";
    btn.addEventListener("click", () => gotoIndex(null));
    turnBannerEl.appendChild(btn);
  }

  document.getElementById("btn-nav-first").addEventListener("click", () => gotoIndex(0));
  document.getElementById("btn-nav-prev").addEventListener("click", () => gotoIndex(effectiveIndex() - 1));
  document.getElementById("btn-nav-next").addEventListener("click", () => gotoIndex(effectiveIndex() + 1));
  document.getElementById("btn-nav-last").addEventListener("click", () => gotoIndex(null));

  // 键盘左右方向键也能翻棋谱，浏览长对局时顺手
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowLeft") { e.preventDefault(); gotoIndex(effectiveIndex() - 1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); gotoIndex(effectiveIndex() + 1); }
    else if (e.key === "Home") { e.preventDefault(); gotoIndex(0); }
    else if (e.key === "End") { e.preventDefault(); gotoIndex(null); }
  });

  /** 从后端拉取整局的每步局面，填充 positionHistory / moveMeta */
  async function loadHistoryPositions(id) {
    const data = await apiGet(`/games/${id}/replay`);
    positionHistory = [data.initial_board || {}];
    moveMeta = [null];   // 下标与 positionHistory 对齐，第0项占位
    (data.steps || []).forEach((step) => {
      positionHistory.push(step.board);
      moveMeta.push({
        notation: step.notation,
        side: step.side,
        from_sq: step.from_sq,
        to_sq: step.to_sq,
      });
    });
    historyEntries = moveMeta.slice(1).map((m) => m.notation);
  }

  /** 纯复盘模式：只读浏览一局已经结束的对局 */
  async function startReplay(id) {
    replayOnly = true;
    gameId = id;
    gameIdChip.textContent = "对局: " + id;
    if (socket) { socket.onclose = null; socket.close(); socket = null; }

    try {
      await loadHistoryPositions(id);
    } catch (err) {
      setMessage("复盘加载失败：" + err.message);
      return;
    }
    if (positionHistory.length <= 1) {
      setMessage(`对局 ${id} 还没有任何走子记录，无法复盘。`);
      return;
    }

    // 复盘也要显示双方是谁、时间控制等信息
    try {
      const state = await apiGet(`/games/${id}`);
      gameResult = state.result;
      currentSide = state.current_side;
      lastEndReason = state.end_reason || null;
      boardFlipped = false;
      renderGameInfo(state);
      renderPlayerCards(state);
      renderResultPanel(state);
    } catch (err) { /* 信息拉不到不影响看棋谱 */ }

    document.getElementById("replay-exit-row").style.display = "block";
    gotoIndex(null);
    setMessage(`正在复盘对局 ${id}（共 ${positionHistory.length - 1} 步），用 ⏮ ◀ ▶ ⏭ 或方向键浏览`);
  }

  document.getElementById("btn-replay-exit").addEventListener("click", () => {
    window.location.href = "index.html";
  });
  document.getElementById("btn-game-review").addEventListener("click", () => {
    window.location.href = `game.html?replay=${gameId}`;
  });
  document.getElementById("btn-back-lobby").addEventListener("click", () => {
    window.location.href = "index.html";
  });
  document.getElementById("btn-rematch").addEventListener("click", async () => {
    // 简化版 Rematch：按这局同样的时间控制/模式开一局新对局，
    // 不是"邀请刚才那个对手再来一局"（那需要一套邀请/配对机制，这里没做）
    try {
      const body = {
        rated: !!currentStateRated,
        minutes_per_side: clockState.timeControl ? clockState.timeControl.minutes_per_side : null,
        increment_seconds: clockState.timeControl ? clockState.timeControl.increment_seconds : 0,
      };
      const data = await apiPost("/games", body);
      window.location.href = `game.html?id=${data.game_id}`;
    } catch (err) {
      setMessage("创建新对局失败：" + err.message);
    }
  });

  // -------------------------------------------------------------------
  // Single game（本机双人对战）：精简界面，不显示时间控制/双方信息/
  // 对局信息/聊天室/悔棋提和认输的协商按钮，换成一个即时撤回 + Quit。
  // -------------------------------------------------------------------
  function applySingleModeLayout() {
    ["player-card-top", "player-card-bottom", "right-info-col"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.style.display = "none";
    });
    document.getElementById("action-row-normal").style.display = "none";
    document.getElementById("action-row-single").style.display = "flex";
    document.getElementById("btn-quit-single").style.display = "inline-block";
  }

  document.getElementById("btn-single-undo").addEventListener("click", async () => {
    try {
      const state = await apiPost(`/games/${gameId}/undo`);
      handleIncomingState(state);
    } catch (err) {
      setMessage(err.message);
    }
  });

  document.getElementById("btn-quit-single").addEventListener("click", () => {
    // single game 本来就完全不落库，这里不需要额外通知后端"别保存"——
    // 直接离开就行，这局数据本来就只存在于这一次的内存里
    window.location.href = "index.html";
  });

  function setMessage(text) { messageEl.textContent = text || ""; }

  // -------------------------------------------------------------------
  // WebSocket 实时同步
  // -------------------------------------------------------------------
  let socket = null;

  function connectSocket(id) {
    if (socket) { socket.onclose = null; socket.close(); socket = null; }
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    socket = new WebSocket(`${protocol}//${location.host}/ws/games/${id}`);
    socket.onmessage = (event) => handleIncomingState(JSON.parse(event.data));
    socket.onerror = () => setMessage("实时连接出现问题，如果对方走棋后棋盘没反应，试试刷新页面。");
  }

  function handleIncomingState(state) {
    selected = null;
    legalDestinations = [];
    disarm();
    applyState(state);
  }

  // -------------------------------------------------------------------
  // 后端交互
  // -------------------------------------------------------------------
  function getGuestId() {
    let id = localStorage.getItem("arkatana_guest_id");
    if (!id) {
      id = "guest-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem("arkatana_guest_id", id);
    }
    return id;
  }
  const GUEST_ID = getGuestId();

  async function apiPost(path, body) {
    const headers = { "Content-Type": "application/json", "X-Guest-Id": GUEST_ID };
    if (authToken) headers["X-Auth-Token"] = authToken;
    const res = await fetch(path, { method: "POST", headers, body: body ? JSON.stringify(body) : undefined });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "请求失败");
    return data;
  }

  async function apiGet(path) {
    const headers = { "X-Guest-Id": GUEST_ID };
    if (authToken) headers["X-Auth-Token"] = authToken;
    const res = await fetch(path, { headers });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "请求失败");
    return data;
  }

  async function fetchRating(username) {
    if (!username) return null;
    if (ratingCache[username]) return ratingCache[username];
    try {
      const data = await apiGet(`/users/${encodeURIComponent(username)}/rating`);
      ratingCache[username] = data;
      return data;
    } catch (e) {
      return null;
    }
  }

  function renderAuthStatus() {
    // 对局界面只在顶栏显示当前身份，不再放登录表单
    authStatusMiniEl.textContent = authUsername || "未登录";
  }

  function setAuth(token, username) {
    authToken = token;
    authUsername = username;
    if (token) {
      localStorage.setItem("arkatana_token", token);
      localStorage.setItem("arkatana_username", username);
    } else {
      localStorage.removeItem("arkatana_token");
      localStorage.removeItem("arkatana_username");
    }
    renderAuthStatus();
  }

  // -------------------------------------------------------------------
  // 棋钟
  // -------------------------------------------------------------------
  let clockState = { blackTime: null, whiteTime: null, timeControl: null, syncedAt: null };

  function formatClock(seconds) {
    if (seconds === null || seconds === undefined) return "--:--";
    seconds = Math.max(0, seconds);
    const m = Math.floor(seconds / 60);
    const s = Math.floor(seconds % 60);
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  function tickClocks() {
    if (!clockState.timeControl || gameResult !== "ongoing" || replayOnly) return;
    const elapsed = (Date.now() - clockState.syncedAt) / 1000;
    let blackDisplay = clockState.blackTime;
    let whiteDisplay = clockState.whiteTime;
    if (currentSide === "black") blackDisplay = Math.max(0, clockState.blackTime - elapsed);
    if (currentSide === "white") whiteDisplay = Math.max(0, clockState.whiteTime - elapsed);

    const topSide = boardFlipped ? "black" : "white";
    const bottomSide = boardFlipped ? "white" : "black";
    const bySide = { black: blackDisplay, white: whiteDisplay };

    [["top-clock", topSide], ["bottom-clock", bottomSide]].forEach(([elId, side]) => {
      const el = document.getElementById(elId);
      const timeEl = el.querySelector(".time");
      const val = bySide[side];
      timeEl.textContent = formatClock(val);
      el.classList.toggle("active", currentSide === side && gameResult === "ongoing");
      el.classList.toggle("low", val !== null && val < 20);
    });
  }
  setInterval(tickClocks, 500);

  // -------------------------------------------------------------------
  // 棋手信息卡 / 对局信息 / 状态整体渲染
  // -------------------------------------------------------------------
  async function renderPlayerCards(state) {
    const topSide = boardFlipped ? "black" : "white";
    const bottomSide = boardFlipped ? "white" : "black";
    const nameOf = { black: state.black_player, white: state.white_player };

    const topNameEl = document.getElementById("top-name");
    const bottomNameEl = document.getElementById("bottom-name");
    topNameEl.textContent = nameOf[topSide] || "匿名";
    bottomNameEl.textContent = nameOf[bottomSide] || "匿名";

    document.getElementById("top-clock").querySelector(".increment").textContent =
      state.time_control ? `+${state.time_control.increment_seconds}s` : "";
    document.getElementById("bottom-clock").querySelector(".increment").textContent =
      state.time_control ? `+${state.time_control.increment_seconds}s` : "";

    const topRatingEl = document.getElementById("top-rating");
    const bottomRatingEl = document.getElementById("bottom-rating");
    topRatingEl.textContent = "";
    bottomRatingEl.textContent = "";

    if (nameOf[topSide]) {
      const r = await fetchRating(nameOf[topSide]);
      if (r) topRatingEl.textContent = r.rating;
    }
    if (nameOf[bottomSide]) {
      const r = await fetchRating(nameOf[bottomSide]);
      if (r) bottomRatingEl.textContent = r.rating;
    }
  }

  function renderGameInfo(state) {
    const tcLabel = state.time_control
      ? `${state.time_control.minutes_per_side}+${state.time_control.increment_seconds}　${state.rated ? "rated" : "casual"}`
      : (state.rated ? "无时间限制　rated" : "无时间限制　casual");
    document.getElementById("tc-line").textContent = tcLabel;
    document.getElementById("info-black-name").textContent = state.black_player || "匿名";
    document.getElementById("info-white-name").textContent = state.white_player || "匿名";
    const S = window.ArkatanaShared;
    if (S) {
      document.getElementById("info-black-icon").innerHTML = S.sideIcon("black", 16);
      document.getElementById("info-white-icon").innerHTML = S.sideIcon("white", 16);
    }
  }

  function renderResultPanel(state) {
    const overlayEl = document.getElementById("result-overlay");
    if (state.result === "ongoing") {
      overlayEl.classList.remove("open");
      return;
    }
    const S = window.ArkatanaShared;
    const { text, outcome } = S ? S.resultText(state) : { text: state.result, outcome: "none" };
    resultTextEl.textContent = text;
    // 跟 database 页面用同一套配色规则：黑胜金色 / 白胜白色 / 和棋青铜色
    resultTextEl.className = "result-text outcome-" + outcome;

    // 图标：黑胜→black图标，白胜→white图标，和棋→random（左右各半）图标
    const iconSide = state.result === "black_wins" ? "black"
      : state.result === "white_wins" ? "white" : "random";
    document.getElementById("result-icon").innerHTML = S ? S.sideIcon(iconSide, 48) : "";

    // 双方评分 + 升降箭头（只有 rated 且双方都注册、已经结算过才有数据）
    const playersEl = document.getElementById("result-players");
    playersEl.innerHTML = "";
    const rows = [
      { side: "black", name: state.black_player },
      { side: "white", name: state.white_player },
    ];
    rows.forEach(({ side, name }) => {
      if (!name) return;
      const delta = state.rating_delta && state.rating_delta[side];
      const row = document.createElement("div");
      row.className = "rp-row";
      let html = `${S ? S.sideIcon(side, 14) : ""}<span>${name}</span>`;
      if (delta) {
        const cls = delta.delta > 0 ? "up" : delta.delta < 0 ? "down" : "";
        const arrow = delta.delta > 0 ? "↑" : delta.delta < 0 ? "↓" : "";
        html += `<span class="rp-rating">(${delta.after})</span>`;
        html += `<span class="rp-delta ${cls}">${arrow}${Math.abs(delta.delta)}</span>`;
      }
      row.innerHTML = html;
      playersEl.appendChild(row);
    });

    overlayEl.classList.add("open");
  }

  function detectMove(prev, next, fromSq, toSq) {
    // 用后端给的 last_move_from/to 定位这一步棋，再从前后棋盘取出
    // "移动的是哪枚棋子""终点原本有没有子（也就是吃没吃）"
    if (!prev || !fromSq || !toSq) return null;
    const movingInfo = next[toSq];
    if (!movingInfo) return null;
    if (!prev[fromSq]) return null;          // 起点原本就没子，说明不是一步正常的走子
    const capturedInfo = prev[toSq] || null;
    return { fromSq, toSq, movingInfo, capturedInfo };
  }

  function startMoveAnimation(detected, movedSide, nowInCheck, isCheckmate) {
    anim = { ...detected, startedAt: performance.now() };
    if (animRaf) cancelAnimationFrame(animRaf);

    // 音效在动画"开始"时就播，跟视觉同步；放在动画结束才播会明显滞后，
    // 而且之前己方走棋常常听不到声音，就是因为等到动画结束时状态已被覆盖。
    if (isCheckmate) {
      playSound("checkmate");        // 绝杀：只播这一个，不叠加走子/吃子音效
    } else if (nowInCheck) {
      playSound("check");            // 普通将军
    } else if (detected.capturedInfo) {
      playSound("capture");
    } else {
      playSound(movedSide && mySide && movedSide === mySide ? "moveSelf" : "moveOther");
    }

    const step = () => {
      const elapsed = performance.now() - anim.startedAt;
      if (elapsed >= ANIM_MS) {
        // 动画结束：被吃的棋子此刻才消失（规格要求"待移动动画走完后瞬间消失"）
        anim = null;
        animRaf = null;
        drawBoard();
        renderCaptured();
        return;
      }
      drawBoard();
      animRaf = requestAnimationFrame(step);
    };
    animRaf = requestAnimationFrame(step);
  }

  function applyState(state) {
    const previousBoard = prevBoardState;
    const wasBrowsing = isBrowsingHistory();

    currentSide = state.current_side;
    gameResult = state.result;
    inCheck = !!state.in_check;
    currentStateRated = !!state.rated;
    lastEndReason = state.end_reason || null;
    legalMovesMap = state.legal_moves || {};
    if (state.my_side !== undefined && state.my_side !== null) mySide = state.my_side;
    boardFlipped = mySide === "white" || (!mySide && !!(authUsername && state.white_player === authUsername));

    // 把这次的最新局面并进历史序列：
    //   move_count 就是"走了几步"，正好对应 positionHistory 的下标
    const count = state.move_count;
    if (positionHistory.length === 0) positionHistory = [{}];
    if (count === positionHistory.length) {
      // 正常推进了一步
      positionHistory.push(state.board);
      moveMeta.push({
        notation: state.last_move || "",
        side: currentSide === "black" ? "white" : "black",
        from_sq: state.last_move_from || null,
        to_sq: state.last_move_to || null,
      });
    } else if (count < positionHistory.length - 1) {
      // 悔棋：把多出来的历史截掉
      positionHistory.length = count + 1;
      moveMeta.length = count + 1;
      positionHistory[count] = state.board;
      if (viewIndex !== null && viewIndex > count) viewIndex = null;
    } else {
      // 同一步的重复推送（比如自己走棋的HTTP响应和WebSocket广播各来一次）
      positionHistory[count] = state.board;
    }
    historyEntries = moveMeta.slice(1).map((m) => (m ? m.notation : ""));

    clockState = {
      blackTime: state.black_time,
      whiteTime: state.white_time,
      timeControl: state.time_control,
      syncedAt: Date.now(),
    };

    renderGameInfo(state);
    renderPlayerCards(state);
    renderActionButtons();
    renderOfferBanner(state.pending_offer);
    renderResultPanel(state);
    tickClocks();

    if (wasBrowsing) {
      // 用户正在回看历史，不要把画面强行拽回最新局面——
      // 只刷新棋谱和"回到当前局面"的提示，让他自己决定什么时候回去
      renderHistory();
      renderNavButtons();
      renderTurnBanner();
      return;
    }

    // 跟着最新局面：正常渲染，必要时播放走子动画
    boardState = state.board;
    lastMoveFrom = state.last_move_from || null;
    lastMoveTo = state.last_move_to || null;
    updateOrientations(state.board, lastMoveFrom, lastMoveTo);

    // 如果这次的服务器状态正是我刚才乐观走掉的那一步，说明画面早就更新过了，
    // 不能再播一次动画和音效（否则会看到棋子"抖一下"、声音响两遍）
    const echoesOptimistic = optimisticMove
      && optimisticMove.from === lastMoveFrom
      && optimisticMove.to === lastMoveTo;
    if (echoesOptimistic) optimisticMove = null;

    const detected = (!replayOnly && !echoesOptimistic && previousBoard)
      ? detectMove(previousBoard, boardState, lastMoveFrom, lastMoveTo)
      : null;
    prevBoardState = boardState;

    if (detected) {
      // 走这步的是刚才那一方（现在轮到对面了），据此判断该播己方还是对方音效
      const movedSide = currentSide === "black" ? "white" : "black";
      const isMate = state.result !== "ongoing" && state.end_reason === "checkmate";
      startMoveAnimation(detected, movedSide, inCheck, isMate);
    } else if (echoesOptimistic) {
      // 这一步本地已经走过、动画多半还在播（服务器往往比0.4秒动画先回来）——
      // 千万别把 anim 清掉，否则棋子会在半路上突然瞬移到终点。
      // 将军/绝杀是本地判断不出来的，只能等服务器这份权威状态回来才补音效。
      if (state.result !== "ongoing" && state.end_reason === "checkmate") {
        playSound("checkmate");
      } else if (inCheck) {
        playSound("check");
      }
      if (!anim) { drawBoard(); renderCaptured(); }
    } else if (anim && anim.toSq === lastMoveTo) {
      // 同一步棋的状态会到达两次（自己走棋时，HTTP 响应和 WebSocket 广播各一次），
      // 后到的那次不能把正在播的动画掐掉，否则棋子会半路瞬移
    } else {
      anim = null;
      drawBoard();
      renderCaptured();
    }
    renderHistory();
    renderNavButtons();
    renderTurnBanner();
  }

  async function newGame() {
    selected = null;
    legalDestinations = [];
    historyEntries = [];
    positionHistory = [];
    moveMeta = [null];
    viewIndex = null;
    renderHistory();
    setMessage("正在创建新对局…");
    const state = await apiPost("/games", {});
    gameId = state.game_id;
    gameIdChip.textContent = "对局: " + gameId;
    applyState(state);
    connectSocket(gameId);
    setMessage("新对局已开始，黑方先行。");
  }

  async function loadGame(id) {
    setMessage(`正在加载对局 ${id} …`);
    gameId = id;
    gameIdChip.textContent = "对局: " + gameId;
    selected = null;
    legalDestinations = [];

    // 先把整局的历史局面拉下来——有了它，一进对局就能立刻回看任意一步，
    // 不用等到走了棋才慢慢攒出历史
    positionHistory = [];
    moveMeta = [null];
    viewIndex = null;
    try {
      await loadHistoryPositions(id);
    } catch (e) {
      // 拉不到历史不影响正常下棋，applyState 会从当前局面重新开始攒
      positionHistory = [];
      moveMeta = [null];
    }

    const state = await apiGet(`/games/${id}`);
    applyState(state);
    setMessage(`已加载对局 ${id}`);
    connectSocket(gameId);

    if (authToken) {
      try {
        const joined = await apiPost(`/games/${id}/join`);
        applyState(joined);
        setMessage(`已加入对局 ${id}`);
      } catch (e) { /* 忽略：可能已经是玩家，或对局已满员 */ }
    }
  }

  function selectSquare(sq) {
    const info = boardState[sq];
    if (!info || info.side !== currentSide) {
      selected = null; legalDestinations = []; drawBoard(); return;
    }
    if (info.piece === "TH") {
      selected = null; legalDestinations = []; drawBoard();
      setMessage("王城不可移动");
      return;
    }
    // 合法走法在每次状态更新时已经全量拿到了，这里直接本地查表——
    // 不再发请求，所以点选棋子是零延迟的
    selected = sq;
    legalDestinations = legalMovesMap[sq] || [];
    drawBoard();
    setMessage(legalDestinations.length === 0 ? `${sq} 这个棋子当前没有合法走法（可能被将军钉住了）。` : "");
  }

  /**
   * 在本地立刻把这步棋走掉，不等服务器。
   * 只处理最常见的"移动 + 吃子"，升变这种需要规则判定的交给服务器的权威状态去纠正——
   * 反正服务器响应回来时会覆盖成正确的局面，这里只负责让画面第一时间动起来。
   * @returns 回滚用的快照
   */
  function applyOptimisticMove(from, to) {
    const snapshot = {
      board: boardState,
      currentSide,
      lastMoveFrom,
      lastMoveTo,
      legalMovesMap,
      historyLen: positionHistory.length,
    };

    const movingInfo = boardState[from];
    if (!movingInfo) return snapshot;   // 理论上不会发生，保险起见

    const capturedInfo = boardState[to] || null;
    const nextBoard = { ...boardState };
    delete nextBoard[from];
    nextBoard[to] = movingInfo;

    const movedSide = currentSide;
    boardState = nextBoard;
    currentSide = currentSide === "black" ? "white" : "black";
    lastMoveFrom = from;
    lastMoveTo = to;
    legalMovesMap = {};        // 轮到对方了，我这边先没有可走的棋
    selected = null;
    legalDestinations = [];
    optimisticMove = { from, to };

    updateOrientations(nextBoard, from, to);
    prevBoardState = nextBoard;

    // 立刻播动画和音效——这一步是整个优化的重点：
    // 玩家看到的反馈不再需要等一次跨国网络往返
    const detected = { fromSq: from, toSq: to, movingInfo, capturedInfo };
    startMoveAnimation(detected, movedSide, false, false);

    return snapshot;
  }

  function rollbackOptimisticMove(snapshot) {
    boardState = snapshot.board;
    currentSide = snapshot.currentSide;
    lastMoveFrom = snapshot.lastMoveFrom;
    lastMoveTo = snapshot.lastMoveTo;
    legalMovesMap = snapshot.legalMovesMap;
    optimisticMove = null;
    selected = null;
    legalDestinations = [];
    anim = null;
    if (animRaf) { cancelAnimationFrame(animRaf); animRaf = null; }
    positionHistory.length = snapshot.historyLen;
    moveMeta.length = snapshot.historyLen;
    prevBoardState = boardState;
    updateOrientations(boardState, lastMoveFrom, lastMoveTo);
    drawBoard();
    renderCaptured();
    renderHistory();
    renderNavButtons();
  }

  async function tryMove(from, to) {
    // 先在本地把棋走掉，画面立刻响应；服务器只是"事后确认"
    const snapshot = applyOptimisticMove(from, to);
    try {
      const state = await apiPost(`/games/${gameId}/move`, { from_sq: from, to_sq: to });
      handleIncomingState(state);
      setMessage(`${from} → ${to}：${state.last_move}`);
    } catch (err) {
      // 服务器不认这步棋（非法走法、不是你的回合、对局已结束……）：把画面退回去
      rollbackOptimisticMove(snapshot);
      setMessage(err.message);
    }
  }

  canvas.addEventListener("click", (evt) => {
    if (replayOnly || gameResult !== "ongoing" || !gameId) return;
    if (isBrowsingHistory()) {
      // 正在回看历史局面，不能在这里落子——先提示怎么回到当前局面
      setMessage("你正在回看历史局面，点右侧的 → 或 ⏭ 回到当前局面才能走棋。");
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const px = (evt.clientX - rect.left) * scaleX;
    const py = (evt.clientY - rect.top) * scaleY;
    const sq = pixelToSquare(px, py);
    if (!sq) return;
    if (selected && legalDestinations.includes(sq)) {
      tryMove(selected, sq);
    } else {
      selectSquare(sq);
    }
  });


  // -------------------------------------------------------------------
  // 启动：根据网址参数决定进入什么模式
  //   game.html?id=xxxx      加入/查看指定对局
  //   game.html?replay=xxxx  直接进入复盘
  //   都没有                  新建一局（主要用于开发时直接测试）
  // -------------------------------------------------------------------

  // 手机端交互：汉堡抽屉开关
  const drawerEl = document.getElementById("m-drawer");
  const drawerBackdropEl = document.getElementById("m-drawer-backdrop");
  function openDrawer() {
    drawerEl.classList.add("open");
    drawerBackdropEl.classList.add("open");
  }
  function closeDrawer() {
    drawerEl.classList.remove("open");
    drawerBackdropEl.classList.remove("open");
  }
  document.getElementById("btn-mobile-menu").addEventListener("click", openDrawer);
  // 点抽屉之外的任何地方关闭——遮罩层盖住了棋盘等所有内容，
  // 点在遮罩上必然是"点在抽屉外"，不会误触棋盘走子
  drawerBackdropEl.addEventListener("click", closeDrawer);

  renderAuthStatus();

  // 棋子素材预加载：加载完之后重绘一次，把首屏的占位圆牌换成正式造型。
  // 素材还没画好的棋子会一直保持占位样式，不影响下棋。
  if (window.ArkatanaPieces) {
    window.ArkatanaPieces.preloadAll().then(() => {
      if (!anim) drawBoard();
    });
  }

  const urlParams = new URLSearchParams(window.location.search);
  const paramId = urlParams.get("id");
  const paramReplay = urlParams.get("replay");
  const paramSingle = urlParams.get("single") === "1";

  if (paramSingle) {
    singleMode = true;
    applySingleModeLayout();
  }

  if (paramReplay) {
    startReplay(paramReplay).catch((e) => setMessage("复盘加载失败：" + e.message));
  } else if (paramId) {
    loadGame(paramId).catch((e) => setMessage("加载对局失败：" + e.message));
  } else {
    newGame().catch((e) => setMessage("创建对局失败：" + e.message));
  }
})();
</script>

</body>
